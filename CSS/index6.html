<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index6.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" 
    integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" 
    crossorigin="anonymous"
    referrerpolicy="no-referrer" />
    <title>Html and Css learning</title>
</head>
<body>
    <h3>Icon example</h3>
    <i class="fas fa-check"></i>
    <i class="fas fa-times"></i>
    <i class="fas fa-exclamation"></i>
    <i class="fas fa-exclamation-circle"></i>
    <i class="fas fa-exclamation-triangle"></i>
    <i class="fas fa-question"></i>
    <i class="fas fa-question-circle"></i>

    <h3>Social media Icons</h3>
    <i class="fab fa-facebook"></i>
    <i class="fab fa-instagram"></i>
    <i class="fab fa-twitter"></i>
    <i class="fab fa-youtube"></i>

    <h3>Icon sizes</h3>
    <i class="fas fa-check fa-2x"></i>
    <i class="fas fa-check fa-3x"></i>
    <i class="fas fa-check fa-4x"></i>
    <i class="fas fa-check fa-5x"></i>
    <i class="fas fa-check fa-10x"></i>
    <i class="fas fa-times"style="color: red "></i>
    <i class="fas fa-exclamation fa-spin"></i>
    <i class="fas fa-question-circle" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.3);"></i>

    <h3>Button with Icons</h3>
    <button><i class="fas fa-play"></i> Play</button>
    <button><i class="fas fa-pause"></i> Pause</button>
    <button><i class="fas fa-stop"></i> Stop</button>

    <h3>Icon with Text</h3>
    <span><i class="fas fa-envelope"></i>"\n"Contact Us</span>
    <span><i class="fas fa-phone"></i>"\n"Call Us</span>
        


    
</body>
</html>
